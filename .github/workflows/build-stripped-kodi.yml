name: Build Stripped Kodi Android APK

on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: 'Target Architecture'
        required: true
        default: 'arm'
        type: choice
        options:
          - arm
          - aarch64

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bison build-essential cmake curl default-jdk flex \
            gawk git gperf libcurl4-openssl-dev libssl-dev libtool nasm unzip yasm \
            zip zlib1g-dev python3 python3-pip

      # --- RESUME / CACHE STEP ---
      - name: Restore Kodi Dependencies and Tarballs
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/kodi-deps
            ~/kodi-tarballs
          key: kodi-deps-v5-${{ github.event.inputs.target_arch }}-${{ hashFiles('tools/depends/**') }}
          restore-keys: |
            kodi-deps-v5-${{ github.event.inputs.target_arch }}-

      - name: Build Kodi Dependencies
        id: build-deps
        run: |
          TARGET_HOST="${{ github.event.inputs.target_arch == 'aarch64' && 'aarch64-linux-android' || 'arm-linux-androideabi' }}"

          cd tools/depends
          ./bootstrap
          ./configure \
            --host=$TARGET_HOST \
            --with-sdk-path=$ANDROID_HOME \
            --with-ndk-path=$ANDROID_NDK_HOME \
            --with-ndk-api=24 \
            --prefix=$HOME/kodi-deps \
            --with-tarballs=$HOME/kodi-tarballs \
            --enable-debug=no \
            --disable-rav1e

          PLATFORM_NAME="$TARGET_HOST-24-release"
          NATIVE_PLATFORM="x86_64-linux-gnu-native"
          if [ -f "$HOME/kodi-deps/$PLATFORM_NAME/share/Toolchain.cmake" ]; then
            echo "Dependencies restored from cache. Generating stamp files to skip rebuild..."
            for d in native/*/; do touch "$d/.installed-$NATIVE_PLATFORM" 2>/dev/null || true; done
            for d in target/*/; do touch "$d/.installed-$PLATFORM_NAME" 2>/dev/null || true; done
            touch "target/.installed-$PLATFORM_NAME"
          fi

          make -C native
          make -C target -j$(nproc)

      - name: Save Kodi Dependencies Cache
        uses: actions/cache/save@v4
        if: always() && steps.build-deps.conclusion == 'success' && steps.cache-deps.outputs.cache-hit != 'true'
        with:
          path: |
            ~/kodi-deps
            ~/kodi-tarballs
          key: kodi-deps-v5-${{ github.event.inputs.target_arch }}-${{ hashFiles('tools/depends/**') }}


      - name: Configure CMake for Stripped Build
        run: |
          make -C tools/depends/target/cmakebuildsys BUILD_DIR=$HOME/kodi-build \
            CMAKE_EXTRA_ARGUMENTS="-DENABLE_INTERNAL_FFMPEG=OFF -DENABLE_SMBCLIENT=ON -DENABLE_INTERNAL_NFS=ON -DENABLE_UPNP=ON -DENABLE_OPTICAL=OFF -DENABLE_DVDCSS=OFF -DENABLE_BLURAY=OFF -DENABLE_AIRTUNES=OFF -DENABLE_AIRPLAY=OFF -DENABLE_EVENTCLIENTS=OFF -DENABLE_TESTING=OFF"

      - name: Compile and Package APK
        run: |
          cd $HOME/kodi-build
          make -j$(nproc)

          mkdir -p ~/.android
          keytool -genkey -keystore ~/.android/debug.keystore \
            -v -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
            -keypass android -storepass android -keyalg RSA -keysize 2048 -validity 10000

          make apk
          mkdir -p $GITHUB_WORKSPACE/output
          find $HOME/kodi-build $GITHUB_WORKSPACE -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output/ \;


      - name: Upload Stripped Kodi APK
        uses: actions/upload-artifact@v4
        with:
          name: kodi-21-omega-stripped-quartz-${{ github.event.inputs.target_arch }}
          path: output/*.apk
          retention-days: 7
