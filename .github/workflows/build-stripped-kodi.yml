name: Build Stripped Kodi Android APK

on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: 'Android Target Architecture'
        required: true
        default: 'arm'
        type: choice
        options:
          - arm
          - aarch64

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Kodi Omega
        uses: actions/checkout@v4
        with:
          repository: 'xbmc/xbmc'
          ref: '21.0-Omega'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Build Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bison build-essential curl default-jdk flex gawk \
            git gperf libcurl4-openssl-dev libssl-dev libtool nasm unzip yasm \
            zip zlib1g-dev python3 python3-pip

      - name: Set up Android NDK & SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          curl -sLo cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          rm cmdline-tools.zip

          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$HOME/android-sdk/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Build Kodi Native & Cross Dependencies
        run: |
          TARGET_HOST="${{ github.event.inputs.target_arch == 'aarch64' && 'aarch64-linux-android' || 'arm-linux-androideabi' }}"
          
          cd tools/depends
          ./bootstrap
          ./configure \
            --host=$TARGET_HOST \
            --with-sdk-path=$ANDROID_HOME \
            --with-ndk-path=$ANDROID_NDK_HOME \
            --prefix=$HOME/kodi-deps \
            --with-tarballs=$HOME/kodi-tarballs \
            --enable-debug=no
            
          make -j$(nproc)

      - name: Generate CMake Toolchain & Configure Stripped Build
        run: |
          # Generate the toolchain via Kodi's internal depend sys
          make -C tools/depends/target/cmakebuildsys BUILD_DIR=$HOME/kodi-build

          cd $HOME/kodi-build
          cmake . \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_INTERNAL_FFMPEG=ON \
            -DENABLE_SMBCLIENT=ON \
            -DENABLE_UPNP=ON \
            -DENABLE_OPTICAL=OFF \
            -DENABLE_DVDCSS=OFF \
            -DENABLE_BLURAY=OFF \
            -DENABLE_AIRPLAY=OFF \
            -DENABLE_EVENTCLIENTS=OFF \
            -DENABLE_TESTING=OFF

      - name: Compile Core Binary
        run: |
          cd $HOME/kodi-build
          make -j$(nproc)

      - name: Create Signing Key & Package APK
        run: |
          mkdir -p ~/.android
          keytool -genkey -keystore ~/.android/debug.keystore \
            -v -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
            -keypass android -storepass android -keyalg RSA -keysize 2048 -validity 10000

          cd $HOME/kodi-build
          make apk

          mkdir -p $GITHUB_WORKSPACE/output
          find . -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output/ \;

      - name: Upload Stripped Kodi APK
        uses: actions/upload-artifact@v4
        with:
          name: kodi-21-omega-stripped-${{ github.event.inputs.target_arch }}
          path: output/*.apk
          retention-days: 7
